spring.application.name=demo

#Cấu hình kết nối đến DB, nếu chưa có DB sẽ tự động tạo
spring.datasource.url=jdbc:mysql://localhost:3306/Backend_spring_boot?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
#Cấu hình username, password
spring.datasource.username=root
spring.datasource.password=
#Drive MySQL 8+
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Cấu hình DDL tự động tạo hoặc cập nhật bảng
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=VGhpc0lzQVN1cGVyU2VjcmV0S2V5Rm9ySldUSFMyNTYxMjM0NTY=
app.jwt.exparation-time=3600000

#Jackson serialize/deserialize theo PascalCase (Name, Id, Description...) đúng chuẩn frontend ReactJS gửi/nhận
spring.jackson.property-naming-strategy=UPPER_CAMEL_CASE